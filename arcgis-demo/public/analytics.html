<!doctype html><html lang="ms"><head><title>SHIELD Command · Analitik</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🛡️</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://js.arcgis.com/4.31/esri/themes/dark/main.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/highcharts-more.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11.4.8/modules/solid-gauge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://js.arcgis.com/4.31/"></script>
</head><body data-page="analytics"><div id="nav"></div>
<div class="container-fluid px-3 py-3">
<div class="row g-3 mb-3">
  <div class="col-lg-7"><div class="panel panel-body h-100" id="operator"></div></div>
  <div class="col-lg-3 col-md-7"><div class="panel panel-body h-100"><div class="text-muted small text-uppercase" data-date></div><div class="clock" data-clock></div></div></div>
  <div class="col-lg-2 col-md-5"><div class="panel panel-body h-100 d-flex align-items-center justify-content-between"><div><div style="font-size:1.8rem;font-weight:800">31°</div><div class="small text-muted">Bukit Aman, KL<br>Hujan Ringan</div></div><i class="bi bi-cloud-drizzle-fill" style="font-size:2.4rem;color:var(--cyan)"></i></div></div>
</div>
<div class="row g-3 mb-3">
  <div class="col-6 col-md"><div class="kpi kpi-green"><div class="label">Total Active Cases</div><div class="sub">IPD CHERAS</div><div class="value" id="kpiActive">–</div></div></div>
  <div class="col-6 col-md"><div class="kpi kpi-blue"><div class="label">Reported Cases</div><div class="sub">Last 24 hours</div><div class="value" id="kpi24">–</div></div></div>
  <div class="col-6 col-md"><div class="kpi kpi-red"><div class="label">Reported Cases</div><div class="sub">Last 7 days</div><div class="value" id="kpi7">–</div></div></div>
  <div class="col-6 col-md"><div class="kpi kpi-grey"><div class="label">Active MPV</div><div class="sub">Total current active MPV</div><div class="value" id="kpiMpv">–</div></div></div>
  <div class="col-6 col-md"><div class="kpi kpi-grey"><div class="label">Patrol Resources</div><div class="sub">Total patrol units</div><div class="value" id="kpiPatrol">–</div></div></div>
</div>
<div class="row g-3 mb-3">
  <div class="col-lg-8"><div class="panel"><div class="panel-head">Cases Analytics</div><div id="trend" class="chart"></div></div></div>
  <div class="col-lg-4"><div class="panel"><div class="panel-head">Jenis Panggilan</div><div id="pie" class="chart"></div></div></div>
</div>
<div class="row g-3 mb-3">
  <div class="col-md-4"><div class="panel panel-body"><div id="g1"></div></div></div>
  <div class="col-md-4"><div class="panel panel-body"><div id="g2"></div></div></div>
  <div class="col-md-4"><div class="panel panel-body"><div id="g3"></div></div></div>
</div>
<div class="row g-3">
  <div class="col-lg-4"><div class="panel"><div class="panel-head">Mengikut Jenis</div><div id="types" class="chart"></div><div class="px-3 pb-3 small text-muted" id="typeLegend"></div></div></div>
  <div class="col-lg-4"><div class="panel"><div class="panel-head">Mengikut Jam</div><div id="hourly" class="chart"></div></div></div>
  <div class="col-lg-4"><div class="panel"><div class="panel-head">Tindak Balas</div><div id="response" class="chart"></div></div></div>
</div>
</div>
<div id="footer"></div>
<script type="module" src="assets/main.js"></script>
</body></html>
