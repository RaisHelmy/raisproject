[project]
name = "rais-fintech-mcp"
version = "0.1.0"
description = "MCP server exposing the Rais Fintech Wealth API (Cloudflare Worker) to AI assistants."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
rais-fintech-mcp = "rais_fintech_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rais_fintech_mcp"]
