[project]
name = "rais-timesheet-mcp"
version = "0.1.0"
description = "MCP server for Rais Timesheet — WhatsApp work extraction, timesheets, Jira and reports via natural language"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
rais-mcp = "rais_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
