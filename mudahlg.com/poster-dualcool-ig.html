<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<title>Mudah LG — DUALCOOL Poster (IG/FB 1:1)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ddd; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
  .poster {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background: #1A1A1A;
  }
  .poster img.bg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .overlay-gradient {
    position: absolute; left: 0; right: 0; bottom: 0; height: 62%;
    background: linear-gradient(to top, rgba(15,3,7,0.94) 0%, rgba(15,3,7,0.78) 30%, rgba(15,3,7,0.15) 75%, rgba(15,3,7,0) 100%);
  }
  .top-badge {
    position: absolute; top: 34px; left: 34px;
    background: rgba(255,255,255,0.14); backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.35); border-radius: 100px;
    padding: 9px 20px; font-size: 15px; font-weight: 600; letter-spacing: 0.5px;
    color: #fff; text-transform: uppercase;
  }
  .top-badge b { color: #ff5c8a; }
  .content { position: absolute; left: 0; right: 0; bottom: 0; padding: 46px 50px 50px; color: #fff; }
  .headline {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 58px; line-height: 1.12;
    margin-bottom: 12px; letter-spacing: -1px; text-shadow: 0 2px 18px rgba(0,0,0,0.4);
  }
  .headline span { color: #ff5c8a; }
  .subhead { font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.92); margin-bottom: 22px; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
  .chip {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28);
    border-radius: 100px; padding: 9px 18px; font-size: 16px; font-weight: 500; color: #fff;
  }
  .bottom-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: #25D366; color: #fff; font-weight: 700; font-size: 21px;
    padding: 16px 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(37,211,102,0.4);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
  }
  .brand-badge {
    background: #A50034; color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 800;
    font-size: 22px; width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .brand-text span:first-child { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 17px; }
  .brand-text span:last-child { font-size: 12px; color: rgba(255,255,255,0.7); letter-spacing: 0.4px; }
</style>
</head>
<body>
  <div class="poster">
    <img class="bg" src="https://d8j0ntlcm91z4.cloudfront.net/user_3DNcI5N4S9wa2u4AUrBXZ4Ih85f/hf_20260717_183845_146b1628-4f6d-4be0-99a1-5717d9202a7c.png" alt="LG DUALCOOL family scene" />
    <div class="overlay-gradient"></div>
    <div class="top-badge">⚡ LG Subscribe<sup>™</sup> <b>Authorised Agent</b></div>
    <div class="content">
      <div class="headline">Rumah Sejuk,<br><span>Poket Selesa.</span></div>
      <div class="subhead">LG DUALCOOL™ AI Air — Tiada Bayaran Pendahuluan</div>
      <div class="chips">
        <div class="chip">✓ RM10 Verifikasi Sahaja</div>
        <div class="chip">✓ Servis Percuma</div>
        <div class="chip">✓ Waranti Penuh</div>
      </div>
      <div class="bottom-row">
        <div class="brand">
          <div class="brand-badge">LG</div>
          <div class="brand-text"><span>Mudah LG</span><span>mudahlg.com</span></div>
        </div>
        <div class="cta">💬 Chat Agen Sekarang</div>
      </div>
    </div>
  </div>
</body>
</html>
